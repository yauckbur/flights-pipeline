version: 2

models:

  # DAILY MINIMUM PRICE
  - name: daily_min_price
    description: "Cheapest available flight across all UK airports today"

    columns:
      - name: extraction_date
        data_tests:
          - not_null
          - unique

      - name: departure_airport
        data_tests:
          - not_null

      - name: arrival_airport
        data_tests:
          - not_null

      - name: outbound_date
        data_tests:
          - not_null

      - name: return_date
        data_tests:
          - not_null

      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GBP']

      - name: min_price_gbp
        data_tests:
          - not_null


  # HISTORICAL PRICE ANALYSIS
  - name: price_history
    description: "Daily cheapest flight across all UK airports and rolling historical average"

    columns:
      - name: extraction_date
        data_tests:
          - not_null
          - unique

      - name: departure_airport
        data_tests:
          - not_null

      - name: min_price_gbp
        data_tests:
          - not_null

      - name: rolling_7_day_avg_min_price_gbp
        description: "Average minimum price from the previous seven observations"
